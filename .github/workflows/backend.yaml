name: Backend Pipeline

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/backend.yml"
    pull_request:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/backend.yml"

jobs:
    initial_setup:
        runs-on: ubuntu-latest

        # env are Dummy values, otherwise get_settings() will fail validation and crash test collection if they're unset.
        env:
            SUPABASE_URL: "https://placeholder.supabase.co"
            SUPABASE_KEY: "sb_placeholder_key"
            POOLER_DATABASE_URL: "postgresql+psycopg:://placeholder:placeholder@placeholder:5432/placeholder"
            ENVIRONMENT: "development"
            TEST_DB_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres"
        
        steps:
            - uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0             
              with:
                python-version-file: "./backend/.python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                version: "0.12.3"

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                node-version: "24"

            - name: Install Node dependencies
              working-directory: .
              run: npm ci
 
            - name: Start local Supabase stack
              working-directory: .
              run: npx supabase start
 
            - name: Reset and migrate test database
              working-directory: .
              run: npx supabase db reset
 
            - name: Install backend dependencies
              working-directory: ./backend
              run: uv sync --locked

            - name: Lint and Format
              working-directory: ./backend
              run: uv run ruff check .
        
            - name: Run tests
              working-directory: ./backend
              run: uv run pytest -v
        
            - name: Stop Supabase stack
              if: always()
              working-directory: .
              run: npx supabase stop